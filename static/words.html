<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-page="単語帳">単語帳 – langlang</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/icon-64.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="preload" href="/static/fonts/PretendardJPVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/words.css">
  <script src="/static/settings.js"></script>
</head>
<body data-scope="language">
  <header class="topbar">
    <nav class="crumbs" aria-label="現在地">
      <a class="brand" href="/">langlang</a>
      <span class="crumb-sep" aria-hidden="true">›</span>
      <a href="/ko" data-lang-path="" data-lang-label>韓国語</a>
    </nav>
    <nav class="nav" aria-label="画面">
      <a href="/ko" data-lang-path="">ホーム</a>
      <a href="/ko/learn" data-lang-path="learn">学習</a>
      <a href="/ko/words" data-lang-path="words">単語帳</a>
    </nav>
    <span class="spacer"></span>
    <a class="icon-btn" href="/settings?language=ko" data-settings-link title="設定" aria-label="設定">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="6.25"/><circle cx="12" cy="12" r="8.5" stroke-width="3" pathLength="16" stroke-dasharray="0.9 1.1"/><circle cx="12" cy="12" r="2.25"/></svg>
    </a>
  </header>

  <main class="words">
    <section class="list-pane">
      <div class="toolbar" role="search">
        <input id="f-q" class="search" type="text" placeholder="単語か意味で探す" aria-label="検索">
        <select id="f-level" aria-label="レベル"><option value="">すべてのレベル</option></select>
        <select id="f-unit" aria-label="ユニット"><option value="">すべてのユニット</option></select>
        <select id="f-state" aria-label="状態">
          <option value="">すべての状態</option>
          <option value="new">未学習</option>
          <option value="learning">学習中</option>
          <option value="mastered">定着</option>
          <option value="weak">苦手</option>
        </select>
        <span id="f-count" class="count">–</span>
      </div>
      <div id="word-list" class="word-list"><p class="muted">読み込んでいます…</p></div>
    </section>

    <aside id="detail" class="panel detail">
      <p class="detail-empty">単語を選ぶと、ここに詳細が出ます</p>
    </aside>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <script src="/static/toast.js"></script>
  <script src="/static/components/speak.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/words.js"></script>
</body>
</html>
