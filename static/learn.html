<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>学習 – langlang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/learn.css">
  <script src="/static/settings.js"></script>
</head>
<body class="learn-page">
  <header class="topbar learn-bar">
    <a class="brand" href="/">langlang <span class="lang">韓国語</span></a>
    <div class="learn-progress" aria-label="進み具合">
      <ol id="rounds" class="rounds"></ol>
      <div class="meter"><span id="progress-fill" style="width: 0%"></span></div>
    </div>
    <span id="progress-text" class="muted progress-text">–</span>
    <button id="btn-quit" type="button" class="btn ghost" title="学習を中断する（Esc）">中断 <kbd>Esc</kbd></button>
  </header>

  <main class="learn">
    <section id="stage" class="stage" aria-live="polite">
      <p class="muted">読み込んでいます…</p>
    </section>
    <section id="kbd-area" class="kbd-area" hidden>
      <div id="keyboard"></div>
      <p class="kbd-note muted">英字の位置で打ちます（日本語入力はオフのままで大丈夫）。<kbd>←</kbd><kbd>→</kbd> でカーソル移動、<kbd>⏎</kbd> で送る</p>
    </section>
  </main>

  <dialog id="quit-dialog" aria-labelledby="quit-title">
    <form method="dialog">
      <h2 id="quit-title">学習を中断しますか？</h2>
      <p class="muted">ここまでの答えは、記録の仕組みを入れるまでは残りません。</p>
      <div class="actions">
        <button type="submit" value="cancel" class="btn" autofocus>続ける <kbd>Esc</kbd></button>
        <button type="submit" value="quit" class="btn danger">中断する</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <script src="/static/toast.js"></script>
  <script src="/static/langs/ko/keymap.js"></script>
  <script src="/static/langs/ko/composer.js"></script>
  <script src="/static/components/speak.js"></script>
  <script src="/static/components/keyboard.js"></script>
  <script src="/static/components/compose-buffer.js"></script>
  <script src="/static/components/typing-field.js"></script>
  <script src="/static/components/arrow-game.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/learn.js"></script>
</body>
</html>
