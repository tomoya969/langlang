<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-page="学習">学習 – langlang</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/icon-64.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="preload" href="/static/fonts/PretendardJPVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/learn.css">
  <script src="/static/settings.js"></script>
</head>
<body class="learn-page" data-scope="language">
  <header class="topbar learn-bar">
    <button id="btn-quit" type="button" class="btn ghost quit-btn" title="学習を中断する（Esc）" aria-label="学習を中断する">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <kbd>Esc</kbd>
    </button>
    <ol id="rounds" class="progress" aria-label="進み具合"></ol>
    <span id="progress-text" class="progress-text">–</span>
  </header>

  <main class="learn">
    <section id="stage" class="stage" aria-live="polite">
      <p class="muted">読み込んでいます…</p>
    </section>
    <section id="kbd-area" class="kbd-area" hidden>
      <div id="keyboard"></div>
    </section>
  </main>

  <dialog id="quit-dialog" aria-labelledby="quit-title">
    <form method="dialog">
      <h2 id="quit-title">学習を中断しますか？</h2>
      <p class="muted small">ここまでの答えは、記録の仕組みを入れるまでは残りません。</p>
      <div class="actions">
        <button type="submit" value="cancel" class="btn" autofocus>続ける <kbd>Esc</kbd></button>
        <button type="submit" value="quit" class="btn danger">中断する</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <script src="/static/toast.js"></script>
  <script src="/static/common.js"></script>
  <!-- 言語の画面側のパック。言語を足したら、その言語の keymap・composer・pack をここに足す -->
  <script src="/static/langs/ko/keymap.js"></script>
  <script src="/static/langs/ko/composer.js"></script>
  <script src="/static/langs/ko/pack.js"></script>
  <script src="/static/components/speak.js"></script>
  <script src="/static/components/keyboard.js"></script>
  <script src="/static/components/compose-buffer.js"></script>
  <script src="/static/components/typing-field.js"></script>
  <script src="/static/components/arrow-game.js"></script>
  <script src="/static/learn.js"></script>
</body>
</html>
